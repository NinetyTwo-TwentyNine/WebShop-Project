<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div id="navbar"></div>

<div class="container mt-4">

    <h2 class="mb-4">Products</h2>

    <div class="row mb-4">

        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h6 class="card-title text-uppercase text-secondary fw-semibold mb-3">
                        Search
                    </h6>

                    <div class="input-group">
                        <input
                            id="searchInput"
                            class="form-control"
                            placeholder="Type..."
                        >

                        <button
                            id="searchBtn"
                            class="btn btn-primary">
                            🔍️
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h6 class="card-title text-uppercase text-secondary fw-semibold mb-3">
                        Categories
                    </h6>

                    <div id="categoryFilter"></div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h6 class="card-title text-uppercase text-secondary fw-semibold mb-3">
                        Sort
                    </h6>

                    <select
                            id="sortSelect"
                            class="form-select">

                        <option value="newest">Newest</option>
                        <option value="oldest">Oldest</option>

                        <option value="priceAsc">Price ↑</option>
                        <option value="priceDesc">Price ↓</option>

                        <option value="nameAsc">Name A-Z</option>
                        <option value="nameDesc">Name Z-A</option>

                    </select>
                </div>
            </div>
        </div>

    </div>

    <div
            id="productsContainer"
            class="row g-4">
    </div>

    <div
            id="pagination"
            class="mt-4 d-flex justify-content-center">
    </div>

</div>

<div id="footer"></div>

<script type="module" src="../src/ui/products.js"></script>

</body>
</html>
